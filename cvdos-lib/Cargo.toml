[package]
name = "cvdos-lib"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
minhook = "0.9.0"
tokio = { version = "1.48.0", features = ["full"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink"] }
serde_json = "1.0.145"

windows = { version = "0.62.2", features = [
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
] }

archipelago_rs = { git = "https://github.com/nex3/archipelago_rs.git" }
